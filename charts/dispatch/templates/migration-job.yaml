{{- if .Values.migration.enabled }}
# Runs before the first install and before every upgrade, so the schema exists before any new pod starts.
# The runner records each applied file in schema_migrations and holds an advisory lock, so running it again
# is harmless. It is not a rollback hook: migrations only move forward.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dispatch.fullname" . }}-migrate
  labels:
    {{- include "dispatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dispatch.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "dispatch.migrateImage" . | quote }}
          imagePullPolicy: {{ .Values.migrateImage.pullPolicy }}
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.app is required" .Values.secrets.app }}
                  key: MIGRATION_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
